<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Grid</title>
    <link href="css/style.min.css" rel="stylesheet" />

    <style>
      [class^="col"] {
        border: 1px dashed #ccc;
        background-color: rgba(255, 165, 0, 0.05);
        min-height: 80px;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container my-5 bg-white p-4 shadow-sm rounded-3">
      <div class="row mb-4">
        <div class="col-md-3 d-flex align-items-center justify-content-center">
          Фото
        </div>
        <div class="col-md-9">Заголовок + About Me</div>
      </div>

      <div class="row mb-4">
        <div class="col-12">Контакти</div>
      </div>

      <div class="row mb-4">
        <div class="col-md-6">Освіта</div>
        <div class="col-md-6">Досвід роботи</div>
      </div>

      <div class="row">
        <div class="col-md-6">Навички</div>
        <div class="col-md-6">Мови</div>
      </div>
    </div>
  </body>
</html>
